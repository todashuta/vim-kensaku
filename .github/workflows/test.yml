name: Test

on:
  push:
    branches:
      - main
      - vim9script
  pull_request:
    paths:
      - "**.md"
      - "**.vim"
      - "**.sh"
      - "**.tsv"
      - "test/**"
      - "doc/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vim 9.2 is required for the namespace form of :import and Vim9
      # classes, so it is built from source instead of using the Ubuntu
      # package.  The build result is cached by the action.
      - name: Setup Vim
        uses: rhysd/action-setup-vim@v1
        with:
          version: v9.2.1259
          configure-args: |
            --with-features=huge --disable-nls

      - name: Download Migemo compact dictionary
        run: |
          mkdir -p "$HOME/.cache/kensaku.vim"
          curl -fL -o "$HOME/.cache/kensaku.vim/migemo-compact-dict" \
            https://github.com/oguna/migemo-compact-dict-latest/releases/download/v0.2/migemo-compact-dict

      - name: Run tests
        run: ./test/run.sh
